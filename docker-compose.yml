networks:
  bookhub_net:
    external: true


services:
  frontend:
    container_name: bookhub_front_cont
    restart: always
    build: 
      context: .
      args:
        - VITE_API_BASE_URL=/api
    networks:
      - bookhub_net
    ports:
      - 80:80
      - 443:443
    volumes:
      - ./bookhub_certbot/www:/var/www/certbot
      - /etc/letsencrypt:/etc/letsencrypt


