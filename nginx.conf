server{
    listen 80;
    server_name bookhubdev.site www.bookhubdev.site;

    location /.well-known/acme-challenge/{
        root /var/www/certbot;
    }

    location /{
        # try_files $uri $uri/ /index.html;
        return 301 https://$host$request_uri;
    }

}

server {
    listen 443 ssl;
    server_name bookhubdev.site www.bookhubdev.site;

    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 5M;

    ssl_certificate /etc/letsencrypt/live/bookhubdev.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bookhubdev.site/privkey.pem;
    

    location / {
        try_files $uri $uri/ /index.html;
    }

    ssl_protocols TLSv1.2 TLSv1.3; # it tell nginx to use these modern verison
    ssl_ciphers HIGH:!aNULL:!MD5; # this means use High strength encryption and (!aNULL) if any annonymus user intercept in the middle of the connection then exclude that user and exclude old hasing method (!MD5)

    location /api/{
        proxy_pass http://bookhub_back_cont:8000/;

        # upgrade backend call for ws call coz nginx strip the upgraded req send by browser so this will add in the req with updated version
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}