name: frontend_deploy

on:
  push:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: clone repo
        uses: actions/checkout@v4

      - name: set up node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: install dependencies
        run: |
          npm ci
          npm run lint
          npm run build

      - name: Validate docker config and create docker images
        run: |
          docker compose config -q
    
  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: deploy to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{secrets.VPS_HOST}}
          username: ${{secrets.VPS_USER}}
          key: ${{secrets.VPS_SSH_KEY}}
          source: .
          target: /home/shubham/bookhub/frontend
          exclude: ".git/**, .github/**, node_modules/**, dist/**, .env" 

      - name: build docker compose
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{secrets.VPS_HOST}}
          username: ${{secrets.VPS_USER}}
          key: ${{secrets.VPS_SSH_KEY}}
          script: |
            cd /home/shubham/bookhub/frontend
            docker compose up -d --build
